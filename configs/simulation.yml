simulation:
  # Reproducible full run; change this to draw another population.
  seed: 42
  # Enough groups to represent contextual variation.
  n_neighborhoods: 60

# Shared centering/scaling used by both apartment outcome models.
features:
  # Reference neighborhood household size.
  household_size_reference: 2.6
  # A one-unit feature change means 0.5 people.
  household_size_scale: 0.5
  # Reference neighborhood median age in years.
  median_age_reference: 37.0
  # A one-unit feature change means 10 years.
  median_age_scale: 10.0
  # Reference apartment size for centered room effects.
  room_reference: 4.0

neighborhood:
  # SES is centered at the population average.
  ses_mean: 0.0
  # SES units represent standard-deviation differences.
  ses_sd: 1.0
  ses_min: -2.5
  ses_max: 2.5
  # Typical family-age neighborhood baseline.
  median_age_mean: 37.0
  median_age_sd: 5.0
  median_age_min: 25.0
  median_age_max: 52.0
  household_size_baseline: 2.6
  # Older areas tend to have smaller households.
  household_size_age_slope: -0.02
  household_size_noise_sd: 0.25
  household_size_min: 1.8
  household_size_max: 4.2
  # Baseline Poisson log-rate: exp(1) ~= 2.7.
  daycare_log_intercept: 1.0
  # Higher-SES areas have mildly more daycares.
  daycare_ses_coef: 0.15
  # Older areas have mildly fewer daycares.
  daycare_age_coef: -0.03
  school_status_probs:
    existing: 0.55
    planned: 0.20
    none: 0.25

building:
  buildings_per_neighborhood_min: 1
  # Additional Poisson mean above minimum.
  buildings_per_neighborhood_rate: 3.0
  # Typical generated building size.
  apartments_per_building_mean: 40
  # Building-size heterogeneity.
  apartments_per_building_sd: 12
  apartments_per_building_min: 12
  apartments_per_building_max: 80
  # Optional one-value-per-neighborhood override.
  buildings_per_neighborhood: []
  # Optional one-value-per-building override.
  apartments_per_building: []
  room_mix:
    supported_rooms: [3, 4, 5, 6]
    # Larger-household areas favor larger apartments.
    household_size_tilt: 0.35
    # Higher-SES areas mildly favor larger apartments.
    ses_tilt: 0.20
    # Controls decay away from preferred room size.
    room_distance_divisor: 2.0
    # Higher values reduce building-to-building mix variation.
    dirichlet_concentration: 30.0
    # Prior apartment shares before neighborhood tilts and Dirichlet variation.
    base_shares:
      "3": 0.30
      "4": 0.38
      "5": 0.22
      "6": 0.10

# Apartment generation currently has no adjustable parameters. The explicit
# section keeps the component boundary visible and ready for future settings.
apartment: {}

# NB2 log-mean model for total children per apartment.
total_children:
  # Reference 3-room apartment log expected count.
  intercept: -1.30
  ses_quadratic_coef: 0.05
  # Larger local households imply more children.
  household_size_coef: 0.30
  # Positive but diminishing daycare association.
  daycare_saturation_coef: 0.12
  existing_school_coef: 0.10
  planned_school_coef: 0.04
  # Older areas imply fewer children, all else equal.
  median_age_coef: -0.06
  rooms_household_interaction_coef: 0.10
  # Facilities needed to reach 63% saturation.
  daycare_saturation_scale: 3.0
  # Unobserved building-level log-mean variation.
  building_effect_sd: 0.25
  # Unobserved neighborhood log-mean variation.
  neighborhood_effect_sd: 0.20
  # Variance is mu + mu^2 / phi.
  nb_dispersion_phi: 3.0
  # Multipliers relative to 3 rooms are exp(coefficient).
  room_log_mean_effects:
    "4": 0.45
    "5": 0.80
    "6": 0.95

# Lifecycle index: positive values shift children toward older cohorts.
cohort:
  # Larger apartments shift composition toward older cohorts.
  room_coef: 0.30
  # Daycare availability shifts toward younger cohorts.
  daycare_coef: -0.20
  # Older areas shift composition toward older cohorts.
  median_age_coef: 0.25
  household_size_coef: 0.15
  room_age_positive_interaction_coef: 0.12
  # Unobserved building lifecycle variation.
  building_effect_sd: 0.20
  # Kindergarten weight falls with lifecycle.
  kindergarten_lifecycle_slope: -1.0
  # High-school weight rises with lifecycle.
  highschool_lifecycle_slope: 1.1
  # These are exact cohort probabilities when the lifecycle index theta is zero.
  reference_shares:
    kindergarten: 0.40
    elementary: 0.35
    highschool: 0.25
