simulation:
  # Reproducible full run; change this to draw another population.
  seed: 42
  # Enough groups to represent contextual variation.
  n_neighborhoods: 60

# Shared centering/scaling used by both apartment outcome models.
features:
  # Reference neighborhood household size; must equal neighborhood.household_size_baseline.
  household_size_reference: 3.0
  # A one-unit feature change means 0.75 people.
  household_size_scale: 0.75
  # Reference neighborhood median age in years; must equal neighborhood.median_age_baseline.
  median_age_reference: 31.0
  # A one-unit feature change means 10 years.
  median_age_scale: 10.0
  # Reference apartment size for centered room effects.
  room_reference: 4.0

neighborhood:
  # SES is a national standardized index: 0 is the national average.
  ses_mean: 0.0
  # SES units represent standard-deviation differences.
  ses_sd: 1.0
  ses_min: -2.5
  ses_max: 2.5
  # Median age at SES 0; the lowest-SES areas are the youngest.
  median_age_baseline: 31.0
  # Years per SES SD.
  median_age_ses_slope: 3.5
  median_age_noise_sd: 4.5
  median_age_min: 16.0
  median_age_max: 50.0
  # Household size at SES 0 and the baseline age.
  household_size_baseline: 3.0
  # Persons per year: older areas are empty nesters.
  household_size_age_slope: -0.06
  # Reverse-J in SES: large households at the bottom, a small rise at the top.
  household_size_ses_slope: -0.20
  household_size_ses_quadratic_coef: 0.18
  household_size_noise_sd: 0.30
  household_size_min: 1.8
  household_size_max: 6.5
  # Poisson log-rate at the reference neighborhood: exp(1.02) ~= 2.8.
  daycare_log_intercept: 1.02
  # Demand: per person of household size.
  daycare_household_size_coef: 0.30
  # Purchasing power: per SES SD.
  daycare_ses_coef: 0.35
  # Young areas have more daycares: per year.
  daycare_age_coef: -0.03
  # Exact school-status shares at the reference neighborhood (H = 3.0, age 31).
  school_status_reference_shares:
    existing: 0.55
    planned: 0.20
    none: 0.25
  # Log-odds of existing vs none, per person of household size.
  school_existing_household_size_coef: 0.8
  # Log-odds of planned vs none, per year of median age.
  school_planned_age_coef: -0.08

building:
  buildings_per_neighborhood_min: 1
  # Additional Poisson mean above minimum.
  buildings_per_neighborhood_rate: 3.0
  # Tower log-odds at the reference neighborhood without a planned school.
  tower_log_odds_intercept: -2.35
  # Towers need high land value: per SES SD.
  tower_ses_coef: 0.7
  # Renewal targets established areas: per scaled decade of median age.
  tower_median_age_coef: 0.3
  # New, growing areas: a planned school against the other two statuses.
  tower_planned_school_coef: 0.7
  # Hidden neighborhood effect on the tower log-odds: towers come by plan, so they cluster.
  tower_propensity_sd: 1.0
  # Median apartments of a building that keeps the neighborhood texture (6-10 floors).
  texture_apartments_median: 30.0
  # Median apartments of a tower.
  tower_apartments_median: 90.0
  # Hidden neighborhood texture on log size: one neighborhood's buildings are alike.
  apartments_neighborhood_log_sd: 0.25
  # Building-to-building variation on log size.
  apartments_building_log_sd: 0.15
  apartments_per_building_min: 8
  apartments_per_building_max: 160
  # Optional one-value-per-neighborhood override.
  buildings_per_neighborhood: []
  # Optional one-value-per-building override.
  apartments_per_building: []
  room_mix:
    supported_rooms: [3, 4, 5, 6]
    # Household size weighs little: large poor households are crowded.
    household_size_tilt: 0.10
    # Apartment size rises with SES.
    ses_tilt: 0.35
    # Larger buildings hold smaller apartments: per log of size over the texture median.
    building_size_tilt: -0.32
    # Controls decay away from preferred room size.
    room_distance_divisor: 2.0
    # Higher values reduce building-to-building mix variation.
    dirichlet_concentration: 30.0
    # Prior apartment shares before the tilts and Dirichlet variation.
    base_shares:
      "3": 0.30
      "4": 0.41
      "5": 0.24
      "6": 0.05

# Apartment generation currently has no adjustable parameters. The explicit
# section keeps the component boundary visible and ready for future settings.
apartment: {}

# NB2 log-mean model for total children per apartment.
total_children:
  # Reference 3-room apartment log expected count.
  intercept: -0.88
  # The SES U-shape comes through household size; a direct term would double count it.
  ses_quadratic_coef: 0.0
  # Larger local households imply more children.
  household_size_coef: 0.30
  # Positive but diminishing daycare association.
  daycare_saturation_coef: 0.12
  existing_school_coef: 0.10
  planned_school_coef: 0.04
  # Older areas imply fewer children, all else equal.
  median_age_coef: -0.06
  rooms_household_interaction_coef: 0.10
  # Facilities needed to reach 63% saturation.
  daycare_saturation_scale: 3.0
  # Unobserved building-level log-mean variation.
  building_effect_sd: 0.25
  # Unobserved neighborhood log-mean variation.
  neighborhood_effect_sd: 0.20
  # Variance is mu + mu^2 / phi.
  nb_dispersion_phi: 3.0
  # Multipliers relative to 3 rooms are exp(coefficient).
  room_log_mean_effects:
    "4": 0.45
    "5": 0.80
    "6": 0.95

# Lifecycle index: positive values shift children toward older cohorts.
cohort:
  # Larger apartments shift composition toward older cohorts.
  room_coef: 0.30
  # Daycare availability shifts toward younger cohorts.
  daycare_coef: -0.20
  # Older areas shift composition toward older cohorts.
  median_age_coef: 0.25
  household_size_coef: 0.15
  room_age_positive_interaction_coef: 0.12
  # Unobserved building lifecycle variation.
  building_effect_sd: 0.20
  # Kindergarten weight falls with lifecycle.
  kindergarten_lifecycle_slope: -1.0
  # High-school weight rises with lifecycle.
  highschool_lifecycle_slope: 1.1
  # These are exact cohort probabilities when the lifecycle index theta is zero.
  reference_shares:
    kindergarten: 0.40
    elementary: 0.35
    highschool: 0.25
