[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "age-group-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pydantic>=2.11.7",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
notebook = [
    "marimo>=0.8.0",
    "nbformat>=5.10.0",
    "ruff>=0.6.8",
]
test = [
    "pytest>=9.1.1",
]
validation = [
    "statsmodels>=0.14.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/student_simulator"]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
markers = [
    "calibration: canonical seed-sensitive calibration checks",
    "slow: slower coefficient-recovery checks",
]
