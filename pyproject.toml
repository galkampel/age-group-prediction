[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "age-group-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.6,<5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "optuna>=4.5,<5",
    "pandas>=3.0.5",
    "pydantic>=2.11.7",
    "pyro-ppl>=1.9.1,<2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "torch>=2.8,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]
notebook = [
    "marimo>=0.8.0",
    "nbformat>=5.10.0",
    "ruff>=0.6.8",
]
test = [
    "pytest>=9.1.1",
]
tracking = [
    "mlflow>=3.16,<4",
]
validation = [
    "statsmodels>=0.14.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/student_simulator", "src/age_group_prediction"]

[tool.mypy]
# Scoped to the package that is annotated end to end, so the baseline passes
# today. A lenient run over all of src reports 44 errors in 18 files (metrics,
# models, tracking, experiment); widen `files` to ["src"] once those are fixed
# and the override below keeps this package strict while the rest stays lenient.
files = ["src/age_group_prediction/feature_engineering"]
python_version = "3.13"
ignore_missing_imports = true        # sklearn, lightgbm and mlflow ship no stubs
# Type information is read from imported modules, but their errors are not
# reported: checking this package pulls in the parent __init__, and with it the
# 44 pre-existing errors. Drop this line when `files` widens to ["src"].
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "age_group_prediction.feature_engineering.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
markers = [
    "calibration: canonical seed-sensitive calibration checks",
    "slow: slower coefficient-recovery, real-model, tracking, and notebook checks",
]
